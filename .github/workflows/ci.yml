name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-token
      VAULT_KEY: ci-vault-key-ci-vault-key-ci-vault-key
      DATABASE_URL: sqlite:///./ci.db
      MEDIA_ROOT: ./ci-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint && npm run typecheck && npm run build && npm audit --audit-level=high
