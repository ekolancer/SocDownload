[project]
name = "mediavault"
version = "0.1.0"
description = "Personal social media downloader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
engines = [
    "yt-dlp>=2024.12",
    "gallery-dl>=1.27",
    "instaloader==4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
